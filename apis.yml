aid: chempirical
name: Chempirical
image: https://chempirical.com/og-image.png
description: Chempirical (operated as Nitramine per the submission) publishes free
  tools for chemists and a free, keyless, read-only JSON API at chempirical.com/api
  covering compounds (names, formula, SMILES/InChI identifiers, molar mass, density,
  melting and boiling points, Antoine constants, azeotropes), substructure and similarity
  search, structure SVGs, reactions with participants and reaction scaling. CORS is
  open; the docs ask for a few requests per second.
